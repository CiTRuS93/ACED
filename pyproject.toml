[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aced"
version = "0.1.0"
description = "Coordinate coding agents through product experiments with durable progress, verified evidence, and human-controlled approvals"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "ACED contributors" }]
dependencies = []

[project.optional-dependencies]
manager = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28",
  "playwright>=1.50",
  "build>=1.2",
  "hatchling>=1.27",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6",
  "ruff>=0.9",
]

[project.scripts]
aced = "aced.cli:main"
aced-manager-demo = "aced.manager.demo:main"
cddai = "aced.cli:main"
cddai-manager-demo = "aced.manager.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aced", "src/cddai"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "frontend", "docs", "README.md", "LICENSE", "pyproject.toml", "hatch_build.py"]

[tool.hatch.build.hooks.custom]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["aced"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aced"]
