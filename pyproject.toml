[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aced"
version = "0.1.0"
description = "Python framework for durable AI coding-agent workflows and product experiments, with verified evidence and human approvals"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "ACED contributors" }]
dependencies = []
keywords = ["ai-agents", "coding-agents", "workflow-orchestration", "experimentation", "sqlite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/CiTRuS93/ACED"
Documentation = "https://github.com/CiTRuS93/ACED/blob/main/docs/README.md"
Repository = "https://github.com/CiTRuS93/ACED"
Issues = "https://github.com/CiTRuS93/ACED/issues"

[project.optional-dependencies]
manager = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28",
  "playwright>=1.50",
  "build>=1.2",
  "hatchling>=1.27",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6",
  "ruff>=0.9",
]

[project.scripts]
aced = "aced.cli:main"
aced-manager-demo = "aced.manager.demo:main"
cddai = "aced.cli:main"
cddai-manager-demo = "aced.manager.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aced", "src/cddai"]

[tool.hatch.build.targets.sdist]
include = [
  "src", "tests", "examples", "frontend", "docs", "README.md", "CONTRIBUTING.md",
  "LICENSE", "pyproject.toml", "hatch_build.py",
]

[tool.hatch.build.hooks.custom]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["aced"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aced"]
