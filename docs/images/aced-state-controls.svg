<title id="aced-state-controls-title">F · Hold, stopping and reconciliation</title>
<desc id="aced-state-controls-desc">Concurrent controls retain the stage; independent protection remains available if ACED or agents fail.. Development-preview state chart; descriptive conditions are not additional public development stages. Transition guards are specified in the companion document.</desc>
<rect width="1400" height="1530" fill="#ffffff"/>
