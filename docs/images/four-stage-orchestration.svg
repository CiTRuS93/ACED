<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Four-stage orchestration: development preview</title>
<desc id="desc">ACED owns Hypothesize, Implement, Experiment and Decide. Agents own procedures within stages. Existing host infrastructure owns authority, native evidence and independent stopping. Durable waits and evidence-bound handoffs connect the work.</desc>
<rect width="1280" height="820" fill="#f8fafc"/>
<text x="48" y="52.96" fill="#263449" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="start">Four stages. Agent-owned procedures.</text>
<text x="48" y="90.04" fill="#64748b" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Development preview · durable progress, explicit evidence and bounded authority</text>
<rect x="32" y="120" width="1216" height="200" rx="16" fill="#eaf0fa" stroke="#c7d5ed"/>
<text x="52" y="151.26" fill="#21416f" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start">ACED  /  owns the loop and handoffs</text>
<rect x="58" y="181" width="242" height="86" rx="12" fill="#ffffff" stroke="#adc2e0"/>
<text x="74" y="214.94" fill="#193963" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start">Hypothesize</text>
<text x="74" y="244.92" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Candidates; admit cycle plan</text>
<polyline points="307,223 356,223" fill="none" stroke="#315a8e" stroke-width="3" stroke-linejoin="round"/>
<polygon points="356.00,223.00 345.96,227.49 345.96,218.51" fill="#315a8e"/>
